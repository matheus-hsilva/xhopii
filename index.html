<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="assets/login.css">
    <title>Xhopii</title>
</head>
<body>
    <header class="cabecalho">
        <nav class="cabecalho-logo">
            <img src="assets/img/logo.png" alt="Logo da Xhopii">
            <h1>Xhopii</h1>
            <a href="view/home.html">Entre</a>
        </nav>
        <a class="cabecalho-ajuda" href="#">Precisa de ajuda?</a>
    </header>
    

    <main class="login">
        <section class="login-formulario">
            <h2>Login</h2>
            <form action="#">
                <input type="email" placeholder="Email"> 
                <input type="password" placeholder="Senha">
                <button type="submit">ENTRE</button>
            </form>
            <section class="formulario-ajuda">
                <a href="view/redefinir_senha.html">Esqueci minha senha</a>
                <a href="#">Fazer login com SMS</a>
            </section>
            <section class="formulario-separador">
                <hr>
                <p>OU</p>
                <hr>    
            </section>
            <section class="formulario-formas">
                <a href="#"><img src="assets/img/facebook.png" alt="Logo do Facebook">Facebook</a>
                <a href="#"><img src="assets/img/google.png" alt="Logo do Google">Google</a>
                <a href="#"><img src="assets/img/apple.png" alt="Logo da Apple">Apple</a>
            </section>
            <p class="formulario-cadastro">Novo na Xhopii? <a href="view/cadastrar_cliente.html">Cadastrar</a></p>
        </section>
    </main>
    



    <footer class="rodape"> 
    </footer>
    <script src="assets/script.js"></script>
</body>
</html>
